      <ellipse cx="1235" cy="447" rx="271" ry="24" opacity=".2"/>
      <ellipse cx="1235" cy="447" rx="202" ry="12" opacity=".15"/>
    </g>
    <path d="m1066 119 4-10 4 10 10 4-10 4-4 10-4-10-10-4zm355 273 3-8 3 8 8 3-8 3-3 8-3-8-8-3z" fill="#d6c18f"/>
