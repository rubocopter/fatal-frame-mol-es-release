      <text x="91" y="215" fill="#f3efdf" font-family="Georgia, Times New Roman, serif" font-size="76" letter-spacing="4">FATAL FRAME</text>
      <text x="97" y="256" fill="#a7bdcc" font-size="19" letter-spacing="3.5">MASK OF THE LUNAR ECLIPSE</text>
