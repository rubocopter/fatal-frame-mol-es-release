<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="560" viewBox="0 0 1600 560" role="img" aria-labelledby="title desc">
  <title id="title">Fatal Frame: Mask of the Lunar Eclipse — La luna, en castellano</title>
  <desc id="desc">Diseño vectorial original: una luna de marfil sobre círculos azules y líneas doradas, en un cielo negro. Sin imágenes ni logotipos del juego.</desc>
