      <stop stop-color="#5c83a4" stop-opacity=".28"/>
      <stop offset="1" stop-color="#5c83a4" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="moon" x2=".8" y2="1">
      <stop stop-color="#f3efdf"/>
      <stop offset="1" stop-color="#cbbf9f"/>
    </linearGradient>
    <clipPath id="frame"><rect width="1600" height="560" rx="12"/></clipPath>
  </defs>
